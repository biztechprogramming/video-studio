# Daily GitHub trending roundup. The bread-and-butter episode.
#   video-studio make -q trending-daily
name: trending-daily
title: "Top {n} Trending GitHub Projects — {date}"
count: 5
source:
  type: github_trending
  period: daily
video:
  preset: landscape
  cards: overlay         # card rides over generated b-roll; `full` for still slides
footage:
  enabled: true          # the expensive part of an episode — see README "Cost per episode"
  beat_seconds: 8
narration:
  voice: ash             # the host's voice; `video-studio voices` lists the rest
script:
  tone: fast, specific, confident, zero ceremony
  words_per_segment: 85     # the walkthrough half; the stats card gets ~40
youtube:
  upload: false          # flip to true, or pass --publish, when you trust a run unattended
  visibility: unlisted
  tags: [github, trending, open source, developer tools]
