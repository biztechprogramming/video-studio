# Vertical 9:16 cut for YouTube Shorts: fewer items, tighter narration.
name: shorts-trending
title: "{n} GitHub projects trending today"
count: 3
source:
  type: github_trending
  period: daily
script:
  words_per_segment: 35
video:
  preset: shorts
  cards: overlay
footage:
  enabled: true
  # A short segment doesn't need a long shot, and shorts run three of them.
  beat_seconds: 4
youtube:
  upload: false
  visibility: unlisted
  tags: [shorts, github, trending]
